<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>天乃八 掲示板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#282522;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.6}main{max-width:760px;margin:0 auto;padding:24px 14px 70px}h1{text-align:center;font-size:1.65rem}h2{font-size:1.1rem;margin:0 0 12px}.panel{background:white;border:1px solid #e3ded5;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 2px 10px #00000008}label{display:block;font-weight:600;margin:10px 0 4px}input,textarea{width:100%;border:1px solid #b9b2a8;border-radius:7px;padding:10px;font:inherit;background:white}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:7px;background:#46372a;color:white;padding:10px 16px;font:inherit;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#77716a}button.danger{background:#9c3e39}button:disabled{opacity:.5;cursor:wait}.muted{color:#6f6a64;font-size:.92rem}.post{border-top:1px solid #e8e3db;padding:14px 0;overflow-wrap:anywhere}.post:first-child{border-top:0}.posthead{display:flex;gap:12px;align-items:baseline;justify-content:space-between}.posthead time{font-size:.78rem;color:#777}.message{white-space:pre-wrap;margin-top:7px}.status{min-height:1.5em;color:#65451f}.hidden{display:none!important}summary{cursor:pointer;font-weight:600}#adminPanel{margin-top:12px}#adminLogin{margin-top:10px}
</style>
</head>
<body><main>
<h1>天乃八 掲示板</h1><p class="muted" style="text-align:center">投稿は管理者が確認・承認した後に公開されます。</p>
<section class="panel"><h2>メッセージを投稿</h2><form id="postForm"><label for="name">お名前（30文字以内）</label><input id="name" maxlength="30" required autocomplete="name"><label for="message">メッセージ（1000文字以内）</label><textarea id="message" maxlength="1000" required></textarea><button id="submitPost" type="submit">承認待ちとして投稿</button><p id="postStatus" class="status" role="status"></p></form></section>
<section class="panel"><h2>みんなの投稿</h2><div id="publicPosts"><p class="muted">読み込み中…</p></div></section>
<section class="panel"><details id="adminDetails"><summary>管理者用</summary><div id="adminLogin"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" type="button">ログイン</button></div><div id="adminPanel" class="hidden"><p>管理者としてログイン中</p><button id="logoutBtn" class="secondary" type="button">ログアウト</button><h2>承認待ちの投稿</h2><div id="pendingPosts"><p class="muted">読み込み中…</p></div></div><p id="adminStatus" class="status" role="status"></p></details></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getFirestore,collection,query,where,getDocs,addDoc,updateDoc,deleteDoc,doc,getDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyAcdemVICkSXfhZ515fb_CM5pKXbDJiwl4',authDomain:'tennoya-bbs.firebaseapp.com',projectId:'tennoya-bbs',storageBucket:'tennoya-bbs.firebasestorage.app',messagingSenderId:'191259027925',appId:'1:191259027925:web:e5b88686b6634995fcb55c'};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const el=id=>document.getElementById(id);let isAdmin=false;
const fmt=ts=>ts?.toDate?.()?.toLocaleString('ja-JP')||'日時未確定';
function showPosts(target,docs,admin=false,publicAdmin=false){target.replaceChildren();if(!docs.length){const p=document.createElement('p');p.className='muted';p.textContent=admin?'承認待ちの投稿はありません。':'まだ投稿はありません。';target.append(p);return;}
 docs.sort((a,b)=>(b.data().createdAt?.toMillis?.()||0)-(a.data().createdAt?.toMillis?.()||0));
 for(const snap of docs){const data=snap.data(),item=document.createElement('article');item.className='post';const head=document.createElement('div');head.className='posthead';const name=document.createElement('strong');name.textContent=data.name||'匿名';const time=document.createElement('time');time.textContent=fmt(data.createdAt);head.append(name,time);const message=document.createElement('div');message.className='message';message.textContent=data.message||'';item.append(head,message);
 if(admin||publicAdmin){if(admin){const approve=document.createElement('button');approve.textContent='承認';approve.onclick=async()=>{if(!confirm('この投稿を公開しますか？'))return;approve.disabled=true;try{await updateDoc(doc(db,'posts',snap.id),{status:'approved'});await Promise.all([loadPending(),loadPublic()]);el('adminStatus').textContent='承認しました。';}catch(e){el('adminStatus').textContent='承認に失敗しました：'+e.message;approve.disabled=false;}};item.append(approve);}const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=async()=>{if(!confirm('この投稿を削除しますか？'))return;del.disabled=true;try{await deleteDoc(doc(db,'posts',snap.id));await Promise.all([loadPending(),loadPublic()]);el('adminStatus').textContent='削除しました。';}catch(e){el('adminStatus').textContent='削除に失敗しました：'+(e.code||e.message)+'。FirebaseのFirestoreルールで削除が許可されていない可能性があります。';console.error(e);del.disabled=false;}};item.append(del);}
 target.append(item);}}
async function loadPublic(){try{const snap=await getDocs(query(collection(db,'posts'),where('status','==','approved')));showPosts(el('publicPosts'),snap.docs,false,isAdmin);}catch(e){el('publicPosts').textContent='投稿を読み込めませんでした。時間をおいて再度お試しください。';console.error(e);}}
async function loadPending(){if(!isAdmin)return;try{const snap=await getDocs(query(collection(db,'posts'),where('status','==','pending')));showPosts(el('pendingPosts'),snap.docs,true);}catch(e){el('pendingPosts').textContent='承認待ちの取得に失敗しました：'+e.message;}}
el('postForm').addEventListener('submit',async ev=>{ev.preventDefault();const name=el('name').value.trim(),message=el('message').value.trim();if(!name||!message||name.length>30||message.length>1000){el('postStatus').textContent='名前とメッセージを入力してください。';return;}el('submitPost').disabled=true;el('postStatus').textContent='送信中…';try{await addDoc(collection(db,'posts'),{name,message,createdAt:serverTimestamp(),status:'pending'});el('message').value='';el('postStatus').textContent='投稿を受け付けました。管理者の承認後に公開されます。';if(isAdmin)await loadPending();}catch(e){el('postStatus').textContent='投稿できませんでした。通信状況を確認してください。';console.error(e);}finally{el('submitPost').disabled=false;}});
el('loginBtn').onclick=async()=>{el('adminStatus').textContent='ログイン中…';el('loginBtn').disabled=true;try{await signInWithEmailAndPassword(auth,el('email').value.trim(),el('password').value);el('password').value='';}catch(e){el('adminStatus').textContent='ログインできませんでした。メールアドレスとパスワードを確認してください。';console.error(e);}finally{el('loginBtn').disabled=false;}};
el('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{isAdmin=false;el('adminPanel').classList.add('hidden');el('adminLogin').classList.remove('hidden');if(!user){el('adminStatus').textContent='';return;}try{const adminSnap=await getDoc(doc(db,'admins',user.uid));if(!adminSnap.exists()||adminSnap.data().role!=='admin'){el('adminStatus').textContent='このアカウントには管理者権限がありません。';await signOut(auth);return;}isAdmin=true;el('adminLogin').classList.add('hidden');el('adminPanel').classList.remove('hidden');el('adminStatus').textContent='';await Promise.all([loadPending(),loadPublic()]);}catch(e){el('adminStatus').textContent='管理者権限を確認できませんでした。';console.error(e);}});
loadPublic();
</script></body></html>
